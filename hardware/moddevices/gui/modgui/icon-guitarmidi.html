<div class="mod-pedal gm-pedal{{{cns}}}">
  <div mod-role="drag-handle" class="mod-drag-handle gm-handle"></div>
  <header class="gm-head"><div class="gm-title">GUITAR <em>MIDI</em></div><div class="gm-subtitle">Neural guitar-to-MIDI converter</div><div class="gm-bars"><i></i><i></i><i></i></div></header>
  <section class="gm-panels">
    <div class="gm-panel gm-input"><h3>INPUT</h3><div class="gm-controls"><div class="gm-control"><div class="gm-label">Input Gain</div><div class="gm-knob blue" mod-role="input-control-port" mod-port-symbol="gain" title="Input Gain"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="gain"></div></div><div class="gm-control"><div class="gm-label">Expressivity</div><div class="gm-knob blue" mod-role="input-control-port" mod-port-symbol="expressivity" title="Expressivity"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="expressivity"></div></div></div></div>
    <div class="gm-panel gm-onset"><h3>NOTE ONSET</h3><div class="gm-controls"><div class="gm-control"><div class="gm-label">Smoothing</div><div class="gm-knob teal" mod-role="input-control-port" mod-port-symbol="onsetsmoothing" title="Smoothing"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="onsetsmoothing"></div></div><div class="gm-control"><div class="gm-label">Confidence</div><div class="gm-knob teal" mod-role="input-control-port" mod-port-symbol="onsetconfthr" title="Confidence"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="onsetconfthr"></div></div><div class="gm-control"><div class="gm-label">Energy</div><div class="gm-knob teal" mod-role="input-control-port" mod-port-symbol="onsetenthr" title="Energy"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="onsetenthr"></div></div></div></div>
    <div class="gm-panel gm-offset"><h3>NOTE OFFSET</h3><div class="gm-controls"><div class="gm-control"><div class="gm-label">Smoothing</div><div class="gm-knob orange" mod-role="input-control-port" mod-port-symbol="offsetsmoothing" title="Smoothing"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="offsetsmoothing"></div></div><div class="gm-control"><div class="gm-label">Confidence</div><div class="gm-knob orange" mod-role="input-control-port" mod-port-symbol="offsetconfthr" title="Confidence"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="offsetconfthr"></div></div><div class="gm-control"><div class="gm-label">Energy</div><div class="gm-knob orange" mod-role="input-control-port" mod-port-symbol="offsetenthr" title="Energy"></div><div class="gm-value" mod-role="input-control-value" mod-port-symbol="offsetenthr"></div></div></div></div>
  </section>
  <div class="gm-io gm-in"><div class="mod-input" mod-role="input-audio-port" mod-port-symbol="in" title="Guitar audio input"></div></div>
  <div class="gm-io gm-out"><div class="mod-output" mod-role="output-midi-port" mod-port-symbol="midiout" title="MIDI output"></div></div>
  <div class="gm-power-wrap">
    <div class="gm-status-light" mod-role="bypass-light" title="Plugin status indicator"></div>
    <div class="gm-power" mod-role="bypass" title="Click to toggle plugin bypass"><span class="gm-power-text"></span></div>
  </div>
  <footer class="gm-footer">DRAG TO ADJUST · DOUBLE-CLICK TO RESET</footer>
</div>

name: Build GuitarMidi for piStomp v3

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install ARM64 Cross-Compiler and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build ccache gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zip curl tar xz-utils lv2-dev

    
    - name: Configure ARM64 Compilation Cache
      shell: bash
      run: |
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
        echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
        ccache --version

    - name: Restore ARM64 Compilation Cache
      id: arm64-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: arm64-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          arm64-ccache-v1-${{ runner.os }}-


    - name: Fetch and Cross-Compile Upstream Zita-Resampler
      run: |
        # Download verified upstream archive
        curl -L "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/zita-resampler-1.11.2.tar.xz" -o zita.tar.xz
        tar -xJf zita.tar.xz
        cd zita-resampler-1.11.2/source
        
        # Cross-compile target configurations for static linking layout
        export CXX=aarch64-linux-gnu-g++
        
        # Compile source objects using the parent directory path as an include flag
        for src in resampler.cc resampler-table.cc cresampler.cc vresampler.cc; do
            ccache "$CXX" -O2 -Wall -fPIC -I. -I.. -c "$src"
        done
        aarch64-linux-gnu-ar rcs libzita-resampler.a resampler.o resampler-table.o cresampler.o vresampler.o

        echo "Checking for Resampler_table::destroy in the archive..."
        nm -C --defined-only libzita-resampler.a | grep -F 'Resampler_table::destroy' || {
            echo "ERROR: Resampler_table::destroy is not defined in the static archive"
            exit 1
        }
        
        # Populate the target configuration folders that the primary CMake tool expects
        mkdir -p ../../deps/lib ../../deps/include/zita-resampler
        cp libzita-resampler.a ../../deps/lib/
        
        # FIX: The *.h header files are located in the parent directory (..), not inside source/
        
        for header in cresampler.h resampler-table.h resampler.h vresampler.h; do
            header_path=$(find .. -type f -name "$header" -print -quit)

            if [ -z "$header_path" ]; then
                echo "ERROR: Could not find $header"
                find .. -maxdepth 3 -type f -name '*.h' -print
                exit 1
            fi

            cp "$header_path" "$GITHUB_WORKSPACE/deps/include/zita-resampler/"
        done
        
        cd ../..


    - name: Build host-native flatc
      shell: bash
      run: |
        set -euo pipefail
        # Remove any previous build made with the ARM64 cross-compiler.
        rm -rf "$GITHUB_WORKSPACE/flatc-native-build"

        # Build flatc for the GitHub Actions runner, not the Raspberry Pi.
        env -u CC -u CXX -u AR -u AS -u LD \
            -u RANLIB -u STRIP -u CFLAGS -u CXXFLAGS -u LDFLAGS \
          cmake \
            -S "$GITHUB_WORKSPACE/ext/tensorflow/tensorflow/lite/tools/cmake/native_tools/flatbuffers" \
            -B "$GITHUB_WORKSPACE/flatc-native-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/gcc \
            -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build "$GITHUB_WORKSPACE/flatc-native-build" --parallel 2

          # Use the installed flatc, not an intermediate build artifact.
          FLATC_PATH="$GITHUB_WORKSPACE/flatc-native-build/flatbuffers-flatc/bin/flatc"

          if [ ! -x "$FLATC_PATH" ]; then
            echo "ERROR: Host-native flatc was not found at $FLATC_PATH"
            find "$GITHUB_WORKSPACE/flatc-native-build" -type f -name flatc -print
            exit 1
          fi

          # Verify that this executable runs on the GitHub Actions runner.
          file "$FLATC_PATH"
          "$FLATC_PATH" --version

          echo "TFLITE_HOST_TOOLS_DIR=$(dirname "$FLATC_PATH")" >> "$GITHUB_ENV"
    
    - name: Configure CMake for ARM64
      run: |
        mkdir build
        cd build
        
        cmake -G Ninja \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/install_dist" \
          -DBUILD_UI=OFF \
          -DBUILD_ANALYSIS_APP=OFF \
          -DBUILD_DEB=OFF \
          -DGUITARMIDI_SYSEX_DIAGNOSTICS=OFF \
          -DGUITARMIDI_INFERENCE_DIAGNOSTICS=OFF \
          -DZITA_RESAMPLER_INCLUDE_DIR="${GITHUB_WORKSPACE}/deps/include" \
          -DZITA_RESAMPLER_LIB="${GITHUB_WORKSPACE}/deps/lib/libzita-resampler.a" \
          -DTFLITE_HOST_TOOLS_DIR="${TFLITE_HOST_TOOLS_DIR}" \
          ..

    - name: Build and Install Bundle
      run: |
        cd build
        ninja
        ninja install
        
    - name: Show ARM64 Compilation Cache Statistics
      shell: bash
      run: |
        echo "ARM64 compilation cache statistics:"
        ccache --show-stats
        ccache --show-config | grep -E 'cache_dir|max_size'

    - name: Save ARM64 Compilation Cache
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ccache
        key: arm64-ccache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Verify LV2 Bundle and MOD GUI
      shell: bash
      run: |
        set -euo pipefail

        BUNDLE="install_dist/guitarmidi.lv2"

        echo "Verifying piStomp ARM64 LV2 bundle..."

        # Required plugin files
        test -d "$BUNDLE"
        test -f "$BUNDLE/guitarmidi.so"
        test -f "$BUNDLE/guitarmidi.tflite"
        test -f "$BUNDLE/manifest.ttl"
        test -f "$BUNDLE/guitarmidi.ttl"

        # Required MOD GUI files
        test -f "$BUNDLE/modgui.ttl"
        test -d "$BUNDLE/modgui"

        if ! find "$BUNDLE/modgui" -type f | grep -q .; then
          echo "ERROR: MOD GUI directory is empty"
          exit 1
        fi

        # Check for unresolved template placeholders
        if grep -Eq '#<[A-Z_][A-Z_0-9]*>' \
          "$BUNDLE/manifest.ttl" "$BUNDLE/guitarmidi.ttl"; then
          echo "ERROR: Unresolved TTL placeholders found"
          exit 1
        fi

        # Verify the Linux binary reference
        if ! grep -Fq 'lv2:binary <guitarmidi.so>' \
          "$BUNDLE/manifest.ttl"; then
          echo "ERROR: Incorrect ARM64 plugin binary reference"
          exit 1
        fi

        # Verify MOD GUI reference
        if ! grep -Fq '<modgui.ttl>' "$BUNDLE/manifest.ttl"; then
          echo "ERROR: MOD GUI is not referenced in manifest.ttl"
          exit 1
        fi

        # Headless builds must not advertise the native X11 UI
        if grep -Fq 'GuitarMidi-LV2#ui' \
          "$BUNDLE/manifest.ttl" "$BUNDLE/guitarmidi.ttl"; then
          echo "ERROR: X11 UI metadata found in headless ARM64 build"
          exit 1
        fi

        # Check the actual binary architecture
        if ! file "$BUNDLE/guitarmidi.so" | grep -q 'ARM aarch64'; then
          echo "ERROR: Plugin is not an ARM64 binary"
          file "$BUNDLE/guitarmidi.so"
          exit 1
        fi

        echo "ARM64 LV2 bundle verification successful"
        echo "Final bundle contents:"
        find "$BUNDLE" -type f | sort

    - name: Package Bundle
      run: |
        cd install_dist
        zip -r guitarmidi-pistomp.zip guitarmidi.lv2

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: guitarmidi-pistomp-lv2
        path: install_dist/guitarmidi-pistomp.zip


name: build-windows-x64

on:
  workflow_call:
  workflow_dispatch:
jobs:
  build-windows-x64:
    runs-on: windows-2022

    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "guitarmidi-windows-x64-v1"

    steps:
      - name: Checkout repository recursively
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set Build Version
        shell: pwsh
        run: |
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          $buildId = "build$($env:GITHUB_RUN_NUMBER)-$shortSha"
          "BUILD_ID=$buildId" >> $env:GITHUB_ENV
          Write-Host "Build version: $buildId"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up Windows Compilation Cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Prepare LV2 Headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Downloading LV2 headers..."

          git clone --depth 1 `
            --branch v1.18.10 `
            https://github.com/lv2/lv2.git `
            lv2-source

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download LV2 headers"
          }

          
          $lv2Include = Join-Path $env:GITHUB_WORKSPACE "deps/include"

          New-Item -ItemType Directory `
            -Force $lv2Include | Out-Null

          Copy-Item `
            -Path "lv2-source/include/lv2" `
            -Destination $lv2Include `
            -Recurse `
            -Force

          if (-not (Test-Path "$lv2Include/lv2/core/lv2.h")) {
            throw "LV2 headers not found"
          }

          Write-Host "LV2 headers installed successfully."


      - name: Verify Windows Dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path "deps/include/lv2/core/lv2.h")) {
            throw "Missing LV2 headers"
          }
          Write-Host "LV2 headers verified; SpeexDSP is fetched by CMake."

      - name: Patch TensorFlow Lite MSVC Compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $header = "ext/tensorflow/tensorflow/lite/core/model_building.h"
          $content = Get-Content $header -Raw

          $original = @'
          class InterpreterInfo;
          class Graph;
          '@

          $replacement = @'
          class InterpreterInfo;
          class Graph;
          class Tensor;
          '@

          if (-not $content.Contains($original)) {
            throw "Expected TensorFlow declarations not found"
          }

          $content = $content.Replace($original, $replacement)

          Set-Content -Path $header -Value $content

          Write-Host "Added Tensor forward declaration for MSVC."




      - name: Configure GuitarMidi Windows x64
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"

          $includeDir = (
            Join-Path $env:GITHUB_WORKSPACE "deps/include"
          ).Replace('\', '/')

          Write-Host "Configuring GuitarMidi for Windows x64..."
          Write-Host "Include directory: $includeDir"

          
          cmake -S . -B build-windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_UI=OFF `
            -DBUILD_DEB=OFF `
            -DGUITARMIDI_SYSEX_DIAGNOSTICS=OFF `
            -DGUITARMIDI_INFERENCE_DIAGNOSTICS=OFF `
            -DTFLITE_ENABLE_XNNPACK=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            "-DCMAKE_CXX_FLAGS=/I`"$includeDir`"" `
            "-DCMAKE_C_FLAGS=/I`"$includeDir`""


          if ($LASTEXITCODE -ne 0) {
            throw "Windows CMake configuration failed"
          }

          Write-Host "Windows CMake configuration successful."


      - name: Build GuitarMidi Windows x64
        shell: pwsh
        timeout-minutes: 60
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Building GuitarMidi for Windows x64..."

          cmake --build build-windows --config Release --parallel 4

          if ($LASTEXITCODE -ne 0) {
            throw "Windows GuitarMidi build failed"
          }

          Write-Host "Windows GuitarMidi build completed."

      - name: Test SpeexDSP resampling regression
        shell: pwsh
        run: |
          ctest --test-dir build-windows --output-on-failure -R resampling_regression
          if ($LASTEXITCODE -ne 0) {
            throw "SpeexDSP resampling regression failed"
          }

      - name: Test LV2 MIDI timestamp bounds
        shell: pwsh
        run: |
          ctest --test-dir build-windows --output-on-failure -R midi_timestamp_regression
          if ($LASTEXITCODE -ne 0) {
            throw "LV2 MIDI timestamp regression failed"
          }

      - name: Show Windows Compilation Cache Statistics
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats

      - name: Package and Verify GuitarMidi Windows LV2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --install build-windows `
            --config Release `
            --prefix "$env:GITHUB_WORKSPACE/stage"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows LV2 installation failed"
          }

          $bundle = "$env:GITHUB_WORKSPACE/stage/guitarmidi-pistomp.lv2"

          Write-Host "Verifying Windows LV2 bundle..."

          # Required files
          $required = @(
            "guitarmidi.dll",
            "guitarmidi.tflite",
            "SPEEXDSP-LICENSE.txt",
            "manifest.ttl",
            "guitarmidi.ttl",
            "modgui.ttl"
          )

          foreach ($file in $required) {
            if (-not (Test-Path "$bundle/$file" -PathType Leaf)) {
              throw "Missing LV2 file: $file"
            }
          }

          # Verify MOD GUI directory
          if (-not (Test-Path "$bundle/modgui" -PathType Container)) {
            throw "MOD GUI directory missing"
          }

          $guiFiles = @(
            Get-ChildItem "$bundle/modgui" -File -Recurse
          )

          if ($guiFiles.Count -eq 0) {
            throw "MOD GUI directory is empty"
          }

          # Read generated metadata
          $manifest = Get-Content "$bundle/manifest.ttl" -Raw
          $pluginTTL = Get-Content "$bundle/guitarmidi.ttl" -Raw

          # Check unresolved placeholders
          $placeholderPattern = '#<[A-Z_][A-Z_0-9]*>'

          if ($manifest -match $placeholderPattern -or
              $pluginTTL -match $placeholderPattern) {
            throw "Unresolved TTL placeholders found"
          }

          # Verify Windows DLL reference
          if (-not $manifest.Contains(
            'lv2:binary <guitarmidi.dll>')) {
            throw "Incorrect Windows binary reference"
          }

          # Verify MOD GUI reference
          if (-not $manifest.Contains('<modgui.ttl>')) {
            throw "MOD GUI not referenced in manifest.ttl"
          }

          # Windows must not advertise the X11 native UI
          if ($manifest.Contains('GuitarMidi-LV2#ui') -or
              $pluginTTL.Contains('GuitarMidi-LV2#ui')) {
            throw "X11 UI metadata found in Windows build"
          }

          Write-Host "Windows LV2 verification successful"
          Write-Host "MOD GUI files: $($guiFiles.Count)"
          Write-Host "Final bundle contents:"

          Get-ChildItem $bundle -Recurse -File |
            Select-Object FullName

      - name: Upload Windows LV2 Bundle
        uses: actions/upload-artifact@v6
        with:
          name: guitarmidi-windows-x64-${{ env.BUILD_ID }}
          path: stage/
          if-no-files-found: error

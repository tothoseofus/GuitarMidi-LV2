name: Make Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guitarmidi-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require master branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "ERROR: Run Make Release from master."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read existing CMake project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^project\("GuitarMidi-LV2" VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Cannot read semantic version from CMakeLists.txt"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists. Increment the CMake project version first."
            exit 1
          fi

  build:
    name: Build release artifacts
    needs: validate
    uses: ./.github/workflows/build-all.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download piStomp ARM64 bundle
        uses: actions/download-artifact@v6
        with:
          pattern: guitarmidi-pistomp-build*
          path: release-input/arm64
          merge-multiple: true

      - name: Download Windows x64 bundle
        uses: actions/download-artifact@v6
        with:
          pattern: guitarmidi-windows-x64-build*
          path: release-input/windows
          merge-multiple: true

      - name: Download both Ubuntu Debian packages
        uses: actions/download-artifact@v6
        with:
          pattern: deb-ubuntu-*
          path: release-input/debian
          merge-multiple: true

      - name: Verify and package release files
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          test -f release-input/arm64/guitarmidi-pistomp.lv2/guitarmidi.so
          test -f release-input/arm64/guitarmidi-pistomp.lv2/manifest.ttl
          test -f release-input/windows/guitarmidi-pistomp.lv2/guitarmidi.dll
          test -f release-input/windows/guitarmidi-pistomp.lv2/manifest.ttl
          mkdir -p release-assets
          (cd release-input/arm64 &&
            zip -qr "../../release-assets/guitarmidi-pistomp-${RELEASE_TAG}-aarch64.zip" guitarmidi-pistomp.lv2)
          (cd release-input/windows &&
            zip -qr "../../release-assets/guitarmidi-pistomp-${RELEASE_TAG}-windows-x86_64.zip" guitarmidi-pistomp.lv2)
          find release-input/debian -maxdepth 1 -name '*.deb' -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          echo "Release assets:"
          ls -lh release-assets/

      - name: Prepare release notes (curated notes above generated changelog)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          BODY_FILE="release-body.md"

          # Generate the standard GitHub release notes before creating the tag.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${RELEASE_TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            --jq '.body' > generated-notes.md

          # A version-specific Markdown file, when present, goes above the
          # automatically generated notes. Other versions still work without
          # a curated file.
          if [[ -f "$NOTES_FILE" ]]; then
            echo "Prepending curated release notes: $NOTES_FILE"
            cat "$NOTES_FILE" > "$BODY_FILE"
            printf '\n\n' >> "$BODY_FILE"
          else
            echo "No curated notes at $NOTES_FILE; using generated notes only."
            : > "$BODY_FILE"
          fi
          cat generated-notes.md >> "$BODY_FILE"
          test -s "$BODY_FILE"

      - name: Create version tag and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GuitarMidi-LV2 $RELEASE_TAG" \
            --notes-file release-body.md

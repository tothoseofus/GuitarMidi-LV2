name: Build GuitarMidi for piStomp v3

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM64 Cross-Compiler and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zip curl tar xz-utils

    - name: Fetch and Cross-Compile Upstream Zita-Resampler
      run: |
        # Download verified upstream archive
        curl -L "https://linuxaudio.org" -o zita.tar.xz
        tar -xJf zita.tar.xz
        cd zita-resampler-1.11.2/source
        
        # FIX: Create a local symlink to satisfy internal folder layout include matching
        ln -s . zita-resampler
        
        # Cross-compile target configurations for static linking layout
        export CXX=aarch64-linux-gnu-g++
        
        # Compile source objects with an explicit local include flag (-I.)
        $CXX -O2 -Wall -fPIC -I. -c resampler.cc cresampler.cc vresampler.cc
        aarch64-linux-gnu-ar rcs libzita-resampler.a resampler.o cresampler.o vresampler.o
        
        # Populate the target configuration folders that the primary CMake tool expects
        mkdir -p ../../deps/lib ../../deps/include/zita-resampler
        cp libzita-resampler.a ../../deps/lib/
        cp *.h ../../deps/include/zita-resampler/
        cd ../..

    - name: Configure CMake for ARM64
      run: |
        mkdir build
        cd build
        
        cmake -G "Ninja" \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=./install_dist \
          -DZITA_RESAMPLER_INCLUDE_DIR=${{ github.workspace }}/deps/include \
          -DZITA_RESAMPLER_LIBRARY=${{ github.workspace }}/deps/lib/libzita-resampler.a \
          ..

    - name: Build and Install Bundle
      run: |
        cd build
        ninja
        ninja install

    - name: Package Bundle
      run: |
        cd build/install_dist
        zip -r guitarmidi-pistomp.zip lib/lv2/guitarmidi.lv2 || zip -r guitarmidi-pistomp.zip guitarmidi.lv2

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: guitarmidi-pistomp-lv2
        path: build/install_dist/guitarmidi-pistomp.zip


name: Test Windows Zita-Resampler

on:
  workflow_dispatch:
  push:
    branches:
      - Test-Windows-port

jobs:
  test-zita-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64


      - name: Download Zita-Resampler
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://kokkinizita.linuxaudio.org/linuxaudio/downloads/zita-resampler-1.11.2.tar.xz"

          Write-Host "Downloading Zita-Resampler 1.11.2..."
          Write-Host "URL: $url"

          # Use the native curl executable, not the
          # PowerShell curl alias.
          curl.exe --fail --location `
            --connect-timeout 15 `
            --max-time 90 `
            --retry 2 `
            --show-error `
            --progress-bar `
            --output zita.tar.xz `
            $url

          if ($LASTEXITCODE -ne 0) {
            throw "Zita-Resampler download failed"
          }

          Write-Host "Download completed."

          Get-Item zita.tar.xz |
            Select-Object Name, Length

          Write-Host "Extracting archive..."

          tar -xJf zita.tar.xz

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract Zita-Resampler"
          }

          Write-Host "Extraction completed."

          if (-not (Test-Path "zita-resampler-1.11.2/source/resampler.cc")) {
            throw "Expected Zita-Resampler source files were not found"
          }


      - name: Compile Zita-Resampler with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location zita-resampler-1.11.2/source

          cl /nologo /EHsc /O2 /c `
            resampler.cc `
            resampler-table.cc `
            cresampler.cc `
            vresampler.cc

          if ($LASTEXITCODE -ne 0) {
            throw "Zita-Resampler compilation failed"
          }

          lib /nologo `
            /OUT:zita-resampler.lib `
            resampler.obj `
            resampler-table.obj `
            cresampler.obj `
            vresampler.obj

          if ($LASTEXITCODE -ne 0) {
            throw "Zita-Resampler library creation failed"
          }

          Get-Item zita-resampler.lib

      - name: Upload Zita Library
        uses: actions/upload-artifact@v6
        with:
          name: zita-resampler-windows-x64
          path: zita-resampler-1.11.2/source/zita-resampler.lib
          if-no-files-found: error

name: Build and Test LV2 Plugin

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        ubuntu-version: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.ubuntu-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set Build Version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BUILD_ID="build${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build version: $BUILD_ID"
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ccache pkg-config lv2-dev fakeroot dpkg-dev debhelper libx11-dev libcairo2-dev

      - name: Configure Linux Compilation Cache
        shell: bash
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          ccache --version

      - name: Restore Linux Compilation Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-v1-${{ matrix.ubuntu-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-ccache-v1-${{ matrix.ubuntu-version }}-
      
      - name: Reset Linux Compilation Cache Statistics
        shell: bash
        run: |
          ccache --zero-stats

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DEB=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \

      - name: Build
        run: cmake --build build -- -j$(nproc)
      
      - name: Test SpeexDSP resampling regression
        run: ctest --test-dir build --output-on-failure -R resampling_regression

      - name: Test LV2 MIDI timestamp bounds
        run: ctest --test-dir build --output-on-failure -R midi_timestamp_regression

      - name: Show Linux Compilation Cache Statistics
        shell: bash
        run: |
          echo "Linux compilation cache statistics:"
          ccache --show-stats
          ccache --show-config | grep -E 'cache_dir|max_size'

      - name: Save Linux Compilation Cache
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-v1-${{ matrix.ubuntu-version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Debian package
        run: |
          set -o pipefail
          (cd build && cpack -G DEB -C Release) || (echo "cpack failed" && exit 1)

      - name: Tag and list generated Debian packages
        shell: bash
        run: |
          set -euo pipefail

          UBUNTU_TAG_RAW="${{ matrix.ubuntu-version }}"
          UBUNTU_TAG=$(echo "$UBUNTU_TAG_RAW" | sed -E 's/ubuntu-([0-9]+)\.([0-9]+)/ubuntu\1\2/')

          shopt -s nullglob
          packages=(build/debian/*.deb)

          if (( ${#packages[@]} == 0 )); then
            echo "ERROR: No Debian packages found"
            exit 1
          fi

          for f in "${packages[@]}"; do
            dir=$(dirname "$f")
            base=$(basename "$f" .deb)

            if [[ "$base" =~ _([^_]+)$ ]]; then
              arch_suffix="_${BASH_REMATCH[1]}"
              name_prefix=${base%${arch_suffix}}

              newname="${name_prefix}-${BUILD_ID}_${UBUNTU_TAG}${arch_suffix}.deb"

              mv "$f" "$dir/$newname"
              echo "Created: $newname"
            else
              echo "ERROR: Unexpected Debian filename: $base"
              exit 1
            fi
          done

          find build/debian -name '*.deb' -print
      - name: Verify Debian LV2 Packages
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(build/debian/*.deb)

          if (( ${#packages[@]} == 0 )); then
            echo "ERROR: No Debian packages found"
            exit 1
          fi

          for deb in "${packages[@]}"; do
            echo "Verifying $deb"

            TEMP_DIR=$(mktemp -d)

            # Extract package for inspection
            dpkg-deb -x "$deb" "$TEMP_DIR"

            # Locate the installed LV2 bundle
            BUNDLE=$(find "$TEMP_DIR" \
              -type d -name guitarmidi-pistomp.lv2 -print -quit)

            if [[ -z "$BUNDLE" ]]; then
              echo "ERROR: LV2 bundle missing from $deb"
              exit 1
            fi

            # Required plugin files
            test -f "$BUNDLE/guitarmidi.so"
            test -f "$BUNDLE/guitarmidi_ui.so"
            test -f "$BUNDLE/guitarmidi.tflite"
            test -f "$BUNDLE/SPEEXDSP-LICENSE.txt"
            if readelf -d "$BUNDLE/guitarmidi.so" | grep -iq 'zita'; then
              echo "ERROR: zita dynamic dependency remains"; exit 1
            fi
            test -f "$BUNDLE/manifest.ttl"
            test -f "$BUNDLE/guitarmidi.ttl"

            # Required MOD GUI resources
            test -f "$BUNDLE/modgui.ttl"
            test -d "$BUNDLE/modgui"

            if [[ -z "$(find "$BUNDLE/modgui" -type f -print -quit)" ]]; then
              echo "ERROR: MOD GUI directory is empty"
              exit 1
            fi

            # Check for unresolved placeholders
            if grep -Eq '#<[A-Z_][A-Z_0-9]*>' \
              "$BUNDLE/manifest.ttl" "$BUNDLE/guitarmidi.ttl"; then
              echo "ERROR: Unresolved TTL placeholders"
              exit 1
            fi

            # Verify Linux plugin binary
            if ! grep -Fq 'lv2:binary <guitarmidi.so>' \
              "$BUNDLE/manifest.ttl"; then
              echo "ERROR: Incorrect Linux binary reference"
              exit 1
            fi

            # Verify native X11 UI is advertised
            if ! grep -Fq 'ui:binary <guitarmidi_ui.so>' \
              "$BUNDLE/manifest.ttl"; then
              echo "ERROR: Native X11 UI missing from manifest"
              exit 1
            fi

            if ! grep -Fq 'ui:ui ' "$BUNDLE/guitarmidi.ttl"; then
              echo "ERROR: Native X11 UI reference missing"
              exit 1
            fi

            # Verify MOD GUI is advertised
            if ! grep -Fq '<modgui.ttl>' "$BUNDLE/manifest.ttl"; then
              echo "ERROR: MOD GUI not referenced"
              exit 1
            fi

            # Verify x86-64 architecture
            if ! file "$BUNDLE/guitarmidi.so" | grep -q 'x86-64'; then
              echo "ERROR: Incorrect Linux binary architecture"
              exit 1
            fi

            echo "Package verification successful: $deb"

            rm -rf "$TEMP_DIR"
          done


      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.ubuntu-version }}-${{ env.BUILD_ID }}
          path: build/debian/*.deb
          if-no-files-found: error


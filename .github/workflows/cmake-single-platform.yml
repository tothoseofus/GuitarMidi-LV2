name: Build and Test LV2 Plugin

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        ubuntu-version: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.ubuntu-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config lv2-dev libzita-resampler-dev fakeroot dpkg-dev debhelper libx11-dev libcairo2-dev

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          ZITA_LIB=$(dpkg -L libzita-resampler-dev | grep -E '/libzita-resampler\.so$' | head -n 1)

          if [[ -z "$ZITA_LIB" || ! -e "$ZITA_LIB" ]]; then
            echo "ERROR: zita-resampler library not found"
            exit 1
          fi

          echo "Using zita-resampler: $ZITA_LIB"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DEB=ON \
            -DZITA_RESAMPLER_INCLUDE_DIR=/usr/include \
            -DZITA_RESAMPLER_LIB="$ZITA_LIB"

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Build Debian package
        run: |
          set -o pipefail
          (cd build && cpack -G DEB -C Release) || (echo "cpack failed" && exit 1)

      - name: Tag and list generated Debian packages
        run: |
          UBUNTU_TAG_RAW="${{ matrix.ubuntu-version }}"
          UBUNTU_TAG=$(echo "$UBUNTU_TAG_RAW" | sed -E 's/ubuntu-([0-9]+)\.([0-9]+)/ubuntu\1\2/')
          set -e
          for f in $(find build -name '*.deb'); do
            dir=$(dirname "$f")
            base=$(basename "$f" .deb)
            if [[ "$base" =~ _([^_]+)$ ]]; then
              arch_suffix="_${BASH_REMATCH[1]}"
              name_prefix=${base%${arch_suffix}}
              newname="${name_prefix}_${UBUNTU_TAG}${arch_suffix}.deb"
              mv "$f" "$dir/$newname"
            fi
          done
          find build -name '*.deb' -print

      - name: Upload deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.ubuntu-version }}
          path: build/**/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all deb artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
